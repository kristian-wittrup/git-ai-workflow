name: AI CSS fix proposal

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  propose-fix:
    if: github.event.label.name == 'ai-ready'
    runs-on: [self-hosted, bionic]

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Ask Bionic for a CSS-only fix
        id: fix
        env:
          BIONIC_API_URL: http://127.0.0.1:1234/v1
          BIONIC_MODEL: qwen3.5-4b-mlx
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: bash scripts/ai-css-pr.sh

      - name: Push the proposal branch
        if: steps.fix.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.fix.outputs.branch }}
        run: git push origin "$BRANCH"

      - name: Create a draft pull request
        if: steps.fix.outputs.changed == 'true'
        uses: actions/github-script@v8
        env:
          BRANCH: ${{ steps.fix.outputs.branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = `${owner}:${process.env.BRANCH}`;
            const existing = await github.rest.pulls.list({ owner, repo, head, state: 'open' });

            if (existing.data.length > 0) {
              core.notice(`Draft PR already exists: #${existing.data[0].number}`);
              return;
            }

            await github.rest.pulls.create({
              owner,
              repo,
              head: process.env.BRANCH,
              base: context.payload.repository.default_branch,
              title: `AI proposal: ${process.env.ISSUE_TITLE}`,
              body: `Closes #${process.env.ISSUE_NUMBER}\n\nGenerated by the local Bionic workflow. Please review before merging.`,
              draft: true,
            });
